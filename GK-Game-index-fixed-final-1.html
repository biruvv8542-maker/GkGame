/* ===== TEST PAPER SYSTEM ===== */

const level1Questions = questions.slice(0,10);

function getTestQuestionsForLevel(level){
  if(level===1) return level1Questions;
  if(level===2) return level2Questions;
  if(level===3) return level3Questions;
  if(level===4) return level4Questions;
  if(level===5) return level5Questions;

  if(typeof questionBank!=="undefined" && questionBank[level]){
    return questionBank[level];
  }

  return [];
}

function getPlayedTestQuestions(){
  let pool=[];

  for(let level=1;level<=1000;level++){
    if(localStorage.getItem("level"+level+"Played")){
      let qs=getTestQuestionsForLevel(level);
      qs.forEach(q=>{
        pool.push({
          q:q.q,
          options:q.options,
          answer:q.answer,
          level:level
        });
      });
    }
  }

  return pool;
}

function shuffleTestQuestions(arr){
  let a=arr.slice();

  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

function startTestPaper(){

  let pool=getPlayedTestQuestions();

  if(pool.length<50){
    document.querySelector(".game").innerHTML=
      "<h1>📝 Test Paper</h1>"+
      "<h2>अभी 50 प्रश्न उपलब्ध नहीं हैं।</h2>"+
      "<p>कम से कम 50 खेले हुए प्रश्न चाहिए।</p>"+
      "<p>अभी उपलब्ध प्रश्न: "+pool.length+"</p>"+
      "<br><button class='start' onclick='showLevels()'>📚 Levels</button>";
    return;
  }

  window.testQuestions=shuffleTestQuestions(pool).slice(0,50);

  let html="<h1>📝 Test Paper</h1>";
  html+="<p><b>50 प्रश्न × 2 अंक = 100 अंक</b></p>";

  testQuestions.forEach((q,i)=>{

    html+="<div class='test-question'>";
    html+="<h3>प्रश्न "+(i+1)+"/50</h3>";
    html+="<p><b>"+q.q+"</b></p>";

    q.options.forEach((op,j)=>{
      let letter=String.fromCharCode(65+j);

      html+=
        "<label style='display:block;text-align:left;background:rgba(255,255,255,.12);padding:12px;margin:8px 0;border-radius:12px;cursor:pointer;'>"+
        "<input type='radio' name='testQ"+i+"' value='"+j+"'> "+
        letter+". "+op+
        "</label>";
    });

    html+="</div>";
  });

  html+=
    "<button class='start' onclick='submitTestPaper()'>📤 पेपर जमा करें</button>"+
    "<br><br><button class='start' onclick='showLevels()'>📚 Levels</button>";

  document.querySelector(".game").innerHTML=html;
}

function submitTestPaper(){

  if(!window.testQuestions || testQuestions.length!==50){
    return;
  }

  let score=0;
  let attempted=0;

  testQuestions.forEach((q,i)=>{

    let selected=document.querySelector(
      "input[name='testQ"+i+"']:checked"
    );

    if(selected){
      attempted++;

      if(Number(selected.value)===q.answer){
        score+=2;
      }
    }
  });

  let percentage=score;

  let result={
    score:score,
    total:100,
    percentage:percentage,
    attempted:attempted,
    date:new Date().toLocaleString("hi-IN")
  };

  localStorage.setItem(
    "gkTestResult",
    JSON.stringify(result)
  );

  coins=0;
  localStorage.setItem("gkCoins","0");

  if(document.getElementById("coins")){
    document.getElementById("coins").innerText="0";
  }

  showTestResult();
}

function showTestResult(){

  let saved=localStorage.getItem("gkTestResult");

  if(!saved){
    document.querySelector(".game").innerHTML=
      "<h1>📊 Test Result</h1>"+
      "<p>अभी कोई Test Paper Result नहीं है।</p>"+
      "<button class='start' onclick='showLevels()'>📚 Levels</button>";
    return;
  }

  let r=JSON.parse(saved);

  document.querySelector(".game").innerHTML=
    "<h1>🎉 Test Paper Result</h1>"+
    "<h2>📊 आपका Result</h2>"+
    "<p>📝 कुल अंक: <b>100</b></p>"+
    "<p>🏆 प्राप्त अंक: <b>"+r.score+"</b></p>"+
    "<p>📈 Percentage: <b>"+r.percentage+"%</b></p>"+
    "<p>✅ Attempt किए: <b>"+r.attempted+"/50</b></p>"+
    "<p>🪙 Coins: <b>0</b></p>"+
    "<p>📅 "+r.date+"</p>"+
    "<br><button class='start' onclick='showLevels()'>📚 Levels</button>";
}

function safeCancelSpeech(){
  try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch(e) {}
}

function speakText(text,done){

safeCancelSpeech();
if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") { if(done) done(); return; }

let voice=new SpeechSynthesisUtterance(text);
voice.lang="hi-IN";
voice.rate=0.9;
voice.pitch=1;

voice.onend=function(){
if(done) done();
};

try { window.speechSynthesis.speak(voice); } catch(e) { if(done) done(); }
}

function tickSound(){

if(!audioCtx)return;

let o=audioCtx.createOscillator();
let g=audioCtx.createGain();

o.frequency.value=900;
g.gain.value=0.08;

o.connect(g);
g.connect(audioCtx.destination);

o.start();
o.stop(audioCtx.currentTime+0.08);
}

function startGame(){

safeCancelSpeech();

try {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (AudioContextClass) audioCtx = new AudioContextClass();
} catch(e) { audioCtx = null; }

let selectedLevel=Number(new URLSearchParams(location.search).get("level")||1);

currentLevel=selectedLevel;

let builtInQuestionBank={
1:questions.slice(0,10),
2:level2Questions,
3:level3Questions,
4:level4Questions,
5:level5Questions
};

questions=builtInQuestionBank[selectedLevel]||(typeof questionBank!=="undefined" && questionBank[selectedLevel])||[];

document.getElementById("level").innerText=currentLevel;

currentQuestion=0;
correctAnswers=0;
wrongAnswers=0;

document.querySelector(".start").style.display="none";

document.getElementById("level").innerText=currentLevel;

showQuestion();
}

function showQuestion(){

clearInterval(timer);
safeCancelSpeech();

if(currentQuestion>=questions.length){
endGame();
return;
}

let oldHome=document.getElementById("homeBtn");
if(oldHome) oldHome.remove();

let home=document.createElement("button");
home.id="homeBtn";
home.className="start";
home.innerText="📝 Test Paper"; home.style.display=coins>=1000 ? "inline-block" : "none"; home.onclick=function(){ startTestPaper(); };
home.onclick=function(){
clearInterval(timer);
safeCancelSpeech();
showLevels();
};

document.querySelector(".game").insertBefore(
home,
document.getElementById("question")
);

document.getElementById("question").innerText=
"प्रश्न "+(currentQuestion+1)+"/"+questions.length+"\n"+q.q;
document.getElementById("message").innerText="";
document.getElementById("options").innerHTML="";

q.options.forEach((option,index)=>{

let btn=document.createElement("button");

btn.className="option";
btn.innerText=String.fromCharCode(65+index)+". "+option;
btn.disabled=true;

btn.onclick=function(){
checkAnswer(index);
};

document.getElementById("options").appendChild(btn);

});

document.getElementById("timer").innerText="🔊";

let text=
q.q+
"। A — "+q.options[0]+
"। B — "+q.options[1]+
"। C — "+q.options[2]+
"। D — "+q.options[3];

speakText(text,function(){

document.querySelectorAll(".option").forEach(btn=>{
btn.disabled=false;
});

startTimer();

});

}

function startTimer(){

time=10;
document.getElementById("timer").innerText=time;

timer=setInterval(function(){

time--;

document.getElementById("timer").innerText=time;

tickSound();

if(time<=0){

clearInterval(timer);
timeOut();

}

},1000);

}

function checkAnswer(index){

clearInterval(timer);
safeCancelSpeech();

let q=questions[currentQuestion];

if(index===q.answer){

document.querySelectorAll(".option").forEach((btn,i)=>{
btn.disabled=true;
if(i===q.answer){
btn.style.background="#22c55e";
btn.innerText="✔️ "+(i+1)+". "+q.options[i];
}
});

correctAnswers++;
coins+=10;

localStorage.setItem('gkCoins',coins); document.getElementById("coins").innerText=coins;

document.getElementById("message").innerText=
"✅ सही है! आपने 10 Coins जीते।";

speakText("सही है! आपने 10 Coins जीते।");

}else{

document.querySelectorAll(".option").forEach((btn,i)=>{
btn.disabled=true;
if(i===index){
btn.style.background="#ef4444";
btn.style.color="white";
btn.innerText="❌ "+(i+1)+". "+q.options[i];
}
if(i===q.answer){
btn.style.background="#22c55e";
btn.innerText="✔️ "+(i+1)+". "+q.options[i];
}
});

wrongAnswers++;

document.getElementById("message").innerText=
"❌ गलत है! सही उत्तर है — "+q.options[q.answer];

speakText(
"गलत है! सही उत्तर है — "+q.options[q.answer]
);

}

currentQuestion++;

setTimeout(function(){

let next=document.createElement("button");
next.className="start";
next.innerText="➡️ अगला सवाल";
next.onclick=function(){
next.remove();
showQuestion();
};

document.getElementById("options").appendChild(next);

},1800);

}

function timeOut(){

safeCancelSpeech();

let q=questions[currentQuestion];

let buttons=document.querySelectorAll(".option");

buttons[q.answer].innerText=
"✅ "+q.options[q.answer]+" ✔️";

buttons[q.answer].style.background="#22c55e";

document.getElementById("message").innerText=
"⏰ समय समाप्त! सही उत्तर है — "+q.options[q.answer];

speakText(
"समय समाप्त! सही उत्तर है — "+q.options[q.answer]
);

wrongAnswers++;

currentQuestion++;

setTimeout(function(){

let next=document.createElement("button");
next.className="start";
next.innerText="➡️ अगला सवाल";
next.onclick=function(){
next.remove();
showQuestion();
};

document.getElementById("options").appendChild(next);

},2200);

}

function showLevels(){
  let html="<h1>📚 सभी Levels</h1>";

  let highestPlayed=0;

  for(let i=1;i<=1000;i++){
    if(localStorage.getItem("level"+i+"Played")){
      highestPlayed=i;
    }
  }

  let nextLevel=Math.min(highestPlayed+1,1000);

  /* पहली बार 1000 Coins होने पर Test Paper को इसी Level के नीचे लॉक कर दो */
  if(coins>=1000 && !localStorage.getItem("gkTestPaperLevel")){
    localStorage.setItem("gkTestPaperLevel",String(nextLevel));
  }

  let testLevel=Number(localStorage.getItem("gkTestPaperLevel")||0);
  let testResult=localStorage.getItem("gkTestResult");

  for(let i=1;i<=1000;i++){

    let played=localStorage.getItem("level"+i+"Played");
    let unlocked=(i===1)||localStorage.getItem("level"+(i-1)+"Played");

    let cls=(!played && i===nextLevel)
      ? "level-row new-open-level"
      : "level-row";

    html+="<p class='"+cls+"'>Level "+i+" ";

    if(played){
      html+="✅ खेला हुआ";
    }else if(i===nextLevel){
      html+="🆕 नया खुला हुआ";
    }else{
      html+="🔒 लॉक";
    }

    if(unlocked){
      html+=" <button class='start' onclick='playLevel("+i+")'>▶️ खेलें</button>";
    }

    html+="</p>";

    /* Test Paper हमेशा उसी Level के नीचे रहेगा */
    if(i===testLevel){

      if(testResult){
        html+=
          "<div style='margin:-4px 0 12px 20px;'>"+
          "<button class='start' onclick='showTestResult()'>📊 Test Result देखें</button>"+
          "</div>";
      }else{
        html+=
          "<div style='margin:-4px 0 12px 20px;'>"+
          "<button class='start' onclick='startTestPaper()'>📝 Test Paper</button>"+
          "</div>";
      }
    }
  }

  html+="<br><button class='start' onclick='location.reload()'>⬅️ वापस</button>";

  document.querySelector(".game").innerHTML=
    '<div id="levelList" class="level-list" style="height:70vh;max-height:70vh;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:14px;">'
    +html+
    '</div>';

  setTimeout(function(){
    let list=document.getElementById("levelList");
    let target=list.querySelector(".new-open-level");

    if(target){
      target.scrollIntoView({
        behavior:"auto",
        block:"center"
      });
    }
  },200);
}

function playLevel(level){

location.href="?level="+level;
}

function startLevel2(){
location.href="?level=2";
}
function endGame(){

safeCancelSpeech();

localStorage.setItem("level"+currentLevel+"Played","yes");

document.querySelector(".game").innerHTML=

"<h1>🎉 Level पूरा!</h1>"+
"<h2>📊 Result</h2>"+
"<p>🏆 Level: "+currentLevel+"</p>"+
"<p>✅ खेला हुआ</p>"+
"<p>✅ सही उत्तर: "+correctAnswers+"</p>"+
"<p>❌ गलत उत्तर: "+wrongAnswers+"</p>"+
"<p>🪙 Coins: "+coins+"</p>"+
"<button class='start' onclick='showLevels()'>📚 सभी Levels</button><br><br><button class='start' onclick='location.reload()'>🔄 फिर से खेलें</button>";

}
