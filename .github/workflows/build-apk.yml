name: Build GK Game APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          echo "HTML game files found:"
          ls -lh index.html questions.js
          mkdir -p output
          echo "Android project setup is required to compile an APK."
