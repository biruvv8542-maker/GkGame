name: Build GK Game APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "questions.js"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android WebView project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/brijesh/gkgame
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GKGame"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.brijesh.gkgame'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.brijesh.gkgame'
                  minSdk 24
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="GK Game"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/brijesh/gkgame/MainActivity.java <<'EOF'
          package com.brijesh.gkgame;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.webkit.JavascriptInterface;
          import android.speech.tts.TextToSpeech;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView webView;
              private TextToSpeech tts;
              private boolean ready = false;

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          int r = tts.setLanguage(new Locale("hi", "IN"));
                          if (r == TextToSpeech.LANG_MISSING_DATA ||
                              r == TextToSpeech.LANG_NOT_SUPPORTED) {
                              tts.setLanguage(Locale.getDefault());
                          }
                          ready = true;
                      }
                  });

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.addJavascriptInterface(new Bridge(), "AndroidTTS");
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private class Bridge {
                  @JavascriptInterface
                  public void speak(String text) {
                      runOnUiThread(() -> {
                          if (ready && tts != null && text != null) {
                              tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "gk");
                          }
                      });
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  if (tts != null) tts.shutdown();
                  super.onDestroy();
              }
          }
          EOF

          cp index.html app/src/main/assets/index.html
          cp questions.js app/src/main/assets/questions.js

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GK-Game-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
